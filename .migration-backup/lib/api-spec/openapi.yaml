openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: GO COURSE school API
servers:
  - url: /api
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [school]
      responses:
        "200":
          description: Current native session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginSchoolAccount
      tags: [school]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginInput" }
      responses:
        "200":
          description: Authenticated session, cookie is HttpOnly
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logoutSchoolAccount
      tags: [school]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /auth/password:
    post:
      operationId: changeSchoolPassword
      tags: [school]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthPasswordInput" }
      responses:
        "200":
          description: Password changed and other sessions revoked
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /auth/accounts/{id}/password:
    post:
      operationId: resetSchoolPassword
      tags: [school]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthResetInput" }
      responses:
        "200":
          description: Administrator-only one-time credentials
          content:
            application/json:
              schema:
                type: object
                required: [email, password]
                properties:
                  email: { type: string }
                  password: { type: string }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /school/me:
    get:
      operationId: getSchoolMe
      responses:
        "200":
          description: Current identity and capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolIdentity" }
  /school/summary:
    get:
      operationId: getSchoolSummary
      responses:
        "200":
          description: Real school statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSummary" }
  /school/accounts:
    get:
      operationId: listSchoolAccounts
      responses:
        "200":
          description: Administrator-only account directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolAccount" }
  /school/records/{entity}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSchoolRecords
      responses:
        "200":
          description: Records visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolRecord" }
    post:
      operationId: createSchoolRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
  /school/records/{entity}/{id}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getSchoolRecord
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
    patch:
      operationId: updateSchoolRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRecordInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
    delete:
      operationId: archiveSchoolRecord
      responses:
        "200":
          description: Archived without deleting historical records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
  /school/notifications/read:
    post:
      operationId: readSchoolNotifications
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /school/storage/upload:
    post:
      operationId: requestSchoolUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Signed private upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
  /school/chats:
    get:
      operationId: listSchoolChats
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Conversations visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatConversation" }
  /school/chats/admin/search:
    get:
      operationId: searchSchoolChatDirectory
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200":
          description: Administrator-only people, sections, and conversations search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAdminSearch" }
  /school/chats/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listChatMessages
      responses:
        "200":
          description: Chronological page of immutable messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
    post:
      operationId: createChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Immutable message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /school/chats/{id}/messages/before/{before}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: before, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listOlderChatMessages
      responses:
        "200":
          description: Older chronological page of immutable messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
  /school/chats/{id}/messages/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: searchChatMessages
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageSearchInput" }
      responses:
        "200":
          description: Messages matching a participant-visible text search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
  /school/chats/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: markChatRead
      responses:
        "200":
          description: Conversation marked read through the latest visible message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReadResult" }
  /school/chats/{id}/uploads:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createChatUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatUploadInput" }
      responses:
        "201":
          description: Single-use private upload reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatUpload" }
  /school/chats/uploads/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: completeChatUpload
      responses:
        "200":
          description: Uploaded file verified and ready to attach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAttachment" }
  /school/chats/attachments/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: downloadChatAttachment
      responses:
        "200":
          description: Protected inline attachment stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Protected attachment byte range
  /school/chats/participants/{userId}/avatar:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getChatParticipantAvatar
      responses:
        "200":
          description: Protected avatar for a participant who shares a conversation
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /school/chats/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportInput" }
      responses:
        "201":
          description: Report submitted for administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReport" }
  /school/chats/reports:
    get:
      operationId: listChatReports
      responses:
        "200":
          description: Administrator-only chat reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatReport" }
  /school/chats/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: reviewChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportReviewInput" }
      responses:
        "200":
          description: Report reviewed; message content is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReport" }
  /school/reports/export:
    get:
      operationId: exportSchoolReport
      parameters:
        - { name: entity, in: query, required: true, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: languageId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: courseId, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { type: string } }
        - { name: studySystem, in: query, schema: { type: string } }
        - { name: courseType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: CSV report
          content:
            text/csv:
              schema: { type: string }
components:
  schemas:
    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthPasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    AuthResetInput:
      type: object
      properties:
        password: { type: string, minLength: 12, maxLength: 128 }
    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
    AuthSession:
      type: object
      required: [signedIn, mustChangePassword]
      properties:
        signedIn: { type: boolean }
        mustChangePassword: { type: boolean }
        user:
          anyOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    SchoolIdentity:
      type: object
      required: [signedIn, role, name, adminConfigured]
      properties:
        signedIn: { type: boolean }
        role: { type: string, enum: [guest, admin, staff, teacher, student] }
        id: { type: string }
        profileId: { type: integer }
        name: { type: string }
        email: { type: string }
        adminConfigured: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    SchoolAccount:
      type: object
      required: [id, name, email, role, permissions, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    SchoolSummary:
      type: object
      required: [students, teachers, courses, activeSubscriptions, revenue, currency, upcomingSessions, activity, languageCounts]
      properties:
        students: { type: integer }
        teachers: { type: integer }
        courses: { type: integer }
        activeSubscriptions: { type: integer }
        revenue: { type: number }
        currency: { type: string }
        upcomingSessions:
          type: array
          items: { $ref: "#/components/schemas/SchoolRecord" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/SchoolRecord" }
        languageCounts:
          type: array
          items: { $ref: "#/components/schemas/LanguageCount" }
    LanguageCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    SchoolRecordInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        status: { type: string }
        data:
          type: object
          additionalProperties: true
    SchoolRecord:
      type: object
      required: [id, entity, title, status, data, createdAt, updatedAt]
      properties:
        id: { type: integer }
        entity: { type: string }
        title: { type: string }
        status: { type: string }
        data:
          type: object
          additionalProperties: true
        createdAt: { type: string }
        updatedAt: { type: string }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string }
        courseId: { type: integer }
    UploadResult:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    ChatParticipant:
      type: object
      required: [id, name, role, avatarUrl, canSend]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, staff, teacher, student] }
        profileId: { type: ["integer", "null"] }
        avatarUrl: { type: string }
        canSend: { type: boolean }
    ChatAttachment:
      type: object
      required: [id, name, contentType, size, downloadUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }
        downloadUrl: { type: string }
    ChatMessagePreview:
      type: object
      required: [id, senderId, senderName, body, createdAt, attachments]
      properties:
        id: { type: integer }
        senderId: { type: string }
        senderName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ChatAttachment" }
    ChatConversation:
      type: object
      required: [id, kind, title, sectionTitle, courseId, groupId, members, lastMessage, unreadCount, canSend, updatedAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [group, direct] }
        title: { type: string }
        sectionTitle: { type: string }
        courseId: { type: integer }
        groupId: { type: ["integer", "null"] }
        members:
          type: array
          items: { $ref: "#/components/schemas/ChatParticipant" }
        lastMessage:
          anyOf:
            - { $ref: "#/components/schemas/ChatMessagePreview" }
            - { type: "null" }
        unreadCount: { type: integer }
        canSend: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, conversationId, senderId, senderName, senderAvatarUrl, body, attachments, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatarUrl: { type: string }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ChatAttachment" }
        createdAt: { type: string, format: date-time }
    ChatMessagePage:
      type: object
      required: [messages, hasMore, nextBefore]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        hasMore: { type: boolean }
        nextBefore: { type: ["integer", "null"] }
    ChatMessageInput:
      type: object
      properties:
        body: { type: string, maxLength: 4000 }
        attachmentIds:
          type: array
          maxItems: 8
          items: { type: integer }
    ChatMessageSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 120 }
    ChatReadResult:
      type: object
      required: [conversationId, lastReadMessageId, unreadCount]
      properties:
        conversationId: { type: integer }
        lastReadMessageId: { type: ["integer", "null"] }
        unreadCount: { type: integer }
    ChatUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 26214400 }
        contentType: { type: string }
    ChatUpload:
      type: object
      required: [id, uploadURL, expiresAt]
      properties:
        id: { type: integer }
        uploadURL: { type: string }
        expiresAt: { type: string, format: date-time }
    ChatReportInput:
      type: object
      required: [reason]
      properties:
        messageId: { type: ["integer", "null"] }
        reason: { type: string, enum: [harassment, contact_info, inappropriate, other] }
        details: { type: string, maxLength: 1000 }
    ChatReportReviewInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [resolved, dismissed] }
    ChatReport:
      type: object
      required: [id, conversationId, messageId, reason, details, status, reporterName, messageExcerpt, createdAt, reviewedAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        messageId: { type: ["integer", "null"] }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        reporterName: { type: string }
        messageExcerpt: { type: string }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
    ChatAdminSearch:
      type: object
      required: [people, sections, conversations]
      properties:
        people:
          type: array
          items: { $ref: "#/components/schemas/ChatParticipant" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ChatSectionResult" }
        conversations:
          type: array
          items: { $ref: "#/components/schemas/ChatConversation" }
    ChatSectionResult:
      type: object
      required: [id, courseId, groupId, title, courseTitle]
      properties:
        id: { type: string }
        courseId: { type: integer }
        groupId: { type: ["integer", "null"] }
        title: { type: string }
        courseTitle: { type: string }
