openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: GO COURSE school API
servers:
  - url: /api
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [school]
      responses:
        "200":
          description: Current native session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginSchoolAccount
      tags: [school]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginInput" }
      responses:
        "200":
          description: Authenticated session, cookie is HttpOnly
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logoutSchoolAccount
      tags: [school]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /auth/password:
    post:
      operationId: changeSchoolPassword
      tags: [school]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthPasswordInput" }
      responses:
        "200":
          description: Password changed and other sessions revoked
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /auth/accounts/{id}/password:
    post:
      operationId: resetSchoolPassword
      tags: [school]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthResetInput" }
      responses:
        "200":
          description: Administrator-only one-time credentials
          content:
            application/json:
              schema:
                type: object
                required: [email, password]
                properties:
                  email: { type: string }
                  password: { type: string }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /school/me:
    get:
      operationId: getSchoolMe
      responses:
        "200":
          description: Current identity and capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolIdentity" }
  /school/summary:
    get:
      operationId: getSchoolSummary
      responses:
        "200":
          description: Real school statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSummary" }
  /school/accounts:
    get:
      operationId: listSchoolAccounts
      responses:
        "200":
          description: Administrator-only account directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolAccount" }
  /school/records/{entity}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSchoolRecords
      responses:
        "200":
          description: Records visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolRecord" }
    post:
      operationId: createSchoolRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
  /school/records/{entity}/{id}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getSchoolRecord
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
    patch:
      operationId: updateSchoolRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRecordInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
    delete:
      operationId: archiveSchoolRecord
      responses:
        "200":
          description: Archived without deleting historical records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolRecord" }
  /registration/options:
    get:
      operationId: getRegistrationOptions
      tags: [registration]
      responses:
        "200":
          description: Public registration choices derived from the language catalog and approved price rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationOptions" }
  /registration/quote:
    post:
      operationId: calculateRegistrationQuote
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationQuoteInput" }
      responses:
        "200":
          description: Server-calculated quote, or explicit management review state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationQuote" }
  /registration/requests:
    post:
      operationId: createRegistrationRequest
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequestInput" }
      responses:
        "201":
          description: Registration request saved in PostgreSQL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationReceipt" }
  /admin/registration-requests:
    get:
      operationId: listRegistrationRequests
      tags: [registration]
      responses:
        "200":
          description: Administrator-only registration request queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegistrationAdminRequest" }
  /admin/registration-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateRegistrationRequest
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequestUpdateInput" }
      responses:
        "200":
          description: Updated request with an audit entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationAdminRequest" }
  /admin/registration-requests/{id}/convert:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: convertRegistrationRequest
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationConversionInput" }
      responses:
        "201":
          description: Created academic enrollment linked to the existing student account or profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationConversionReceipt" }
  /admin/registration-pricing:
    get:
      operationId: listRegistrationPricingRules
      tags: [registration]
      responses:
        "200":
          description: Administrator-only price rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegistrationPricingRule" }
  /admin/registration-pricing/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateRegistrationPricingRule
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationPricingRuleUpdateInput" }
      responses:
        "200":
          description: Updated price rule with an immutable audit entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationPricingRule" }
  /school/notifications/read:
    post:
      operationId: readSchoolNotifications
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /school/storage/upload:
    post:
      operationId: requestSchoolUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Signed private upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
  /school/chats:
    get:
      operationId: listSchoolChats
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Conversations visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatConversation" }
  /school/chats/admin/search:
    get:
      operationId: searchSchoolChatDirectory
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200":
          description: Administrator-only people, sections, and conversations search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAdminSearch" }
  /school/chats/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listChatMessages
      responses:
        "200":
          description: Chronological page of immutable messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
    post:
      operationId: createChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Immutable message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /school/chats/{id}/messages/before/{before}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: before, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listOlderChatMessages
      responses:
        "200":
          description: Older chronological page of immutable messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
  /school/chats/{id}/messages/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: searchChatMessages
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageSearchInput" }
      responses:
        "200":
          description: Messages matching a participant-visible text search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
  /school/chats/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: markChatRead
      responses:
        "200":
          description: Conversation marked read through the latest visible message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReadResult" }
  /school/chats/{id}/uploads:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createChatUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatUploadInput" }
      responses:
        "201":
          description: Single-use private upload reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatUpload" }
  /school/chats/uploads/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: completeChatUpload
      responses:
        "200":
          description: Uploaded file verified and ready to attach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAttachment" }
  /school/chats/attachments/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: downloadChatAttachment
      responses:
        "200":
          description: Protected inline attachment stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Protected attachment byte range
  /school/chats/participants/{userId}/avatar:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getChatParticipantAvatar
      responses:
        "200":
          description: Protected avatar for a participant who shares a conversation
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /school/chats/{id}/reports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportInput" }
      responses:
        "201":
          description: Report submitted for administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReport" }
  /school/chats/reports:
    get:
      operationId: listChatReports
      responses:
        "200":
          description: Administrator-only chat reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatReport" }
  /school/chats/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: reviewChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportReviewInput" }
      responses:
        "200":
          description: Report reviewed; message content is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReport" }
  /school/reports/export:
    get:
      operationId: exportSchoolReport
      parameters:
        - { name: entity, in: query, required: true, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: languageId, in: query, schema: { type: integer } }
        - { name: teacherId, in: query, schema: { type: integer } }
        - { name: courseId, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { type: string } }
        - { name: studySystem, in: query, schema: { type: string } }
        - { name: courseType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: CSV report
          content:
            text/csv:
              schema: { type: string }
components:
  schemas:
    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthPasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    AuthResetInput:
      type: object
      properties:
        password: { type: string, minLength: 12, maxLength: 128 }
    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
    AuthSession:
      type: object
      required: [signedIn, mustChangePassword]
      properties:
        signedIn: { type: boolean }
        mustChangePassword: { type: boolean }
        user:
          anyOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    SchoolIdentity:
      type: object
      required: [signedIn, role, name, adminConfigured]
      properties:
        signedIn: { type: boolean }
        role: { type: string, enum: [guest, admin, staff, teacher, student] }
        id: { type: string }
        profileId: { type: integer }
        name: { type: string }
        email: { type: string }
        adminConfigured: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    SchoolAccount:
      type: object
      required: [id, name, email, role, permissions, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    SchoolSummary:
      type: object
      required: [students, teachers, courses, activeSubscriptions, revenue, currency, upcomingSessions, activity, languageCounts]
      properties:
        students: { type: integer }
        teachers: { type: integer }
        courses: { type: integer }
        activeSubscriptions: { type: integer }
        revenue: { type: number }
        currency: { type: string }
        upcomingSessions:
          type: array
          items: { $ref: "#/components/schemas/SchoolRecord" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/SchoolRecord" }
        languageCounts:
          type: array
          items: { $ref: "#/components/schemas/LanguageCount" }
    LanguageCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    SchoolRecordInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        status: { type: string }
        data:
          type: object
          additionalProperties: true
    SchoolRecord:
      type: object
      required: [id, entity, title, status, data, createdAt, updatedAt]
      properties:
        id: { type: integer }
        entity: { type: string }
        title: { type: string }
        status: { type: string }
        data:
          type: object
          additionalProperties: true
        createdAt: { type: string }
        updatedAt: { type: string }
    RegistrationOptions:
      type: object
      required: [pricingOptions, paymentMethods]
      properties:
        pricingOptions:
          type: array
          items: { $ref: "#/components/schemas/RegistrationPricingOption" }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/RegistrationPaymentMethod" }
    RegistrationPricingOption:
      type: object
      required: [id, country, languageId, courseType, studyMode, studySystem, weeklySessions, totalSessions, amount, currency, unit, duration, lessonHours, needsReview, active]
      properties:
        id: { type: integer }
        country: { type: string, enum: [algeria, outside_algeria] }
        languageId:
          anyOf:
            - { type: integer }
            - { type: "null" }
        courseType: { type: string, enum: [level, conversation, exam] }
        studyMode:
          anyOf:
            - { type: string, enum: [group, individual] }
            - { type: "null" }
        studySystem:
          anyOf:
            - { type: string, enum: [regular, intensive] }
            - { type: "null" }
        weeklySessions:
          anyOf:
            - { type: integer }
            - { type: "null" }
        totalSessions:
          anyOf:
            - { type: integer }
            - { type: "null" }
        amount:
          anyOf:
            - { type: number }
            - { type: "null" }
        currency: { type: string }
        unit: { type: string, enum: [monthly, level, package] }
        duration:
          anyOf:
            - { type: string }
            - { type: "null" }
        lessonHours:
          anyOf:
            - { type: number }
            - { type: "null" }
        needsReview: { type: boolean }
        active: { type: boolean }
    RegistrationPaymentMethod:
      type: object
      required: [code, label, countries, manualOnly]
      properties:
        code: { type: string, enum: [ccp, baridi_mob, edahabia_cib, international_manual, other] }
        label: { type: string }
        countries:
          type: array
          items: { type: string, enum: [algeria, outside_algeria] }
        manualOnly: { type: boolean }
    RegistrationQuoteInput:
      type: object
      required: [country, languageId, courseType]
      properties:
        country: { type: string, enum: [algeria, outside_algeria] }
        languageId: { type: integer, minimum: 1 }
        courseType: { type: string, enum: [level, conversation, exam] }
        studyMode: { type: string, enum: [group, individual] }
        studySystem: { type: string, enum: [regular, intensive] }
        weeklySessions: { type: integer, minimum: 1, maximum: 7 }
        totalSessions: { type: integer, minimum: 1, maximum: 100 }
    RegistrationQuote:
      type: object
      required: [languageId, languageTitle, country, courseType, studyMode, studySystem, weeklySessions, totalSessions, duration, amount, currency, unit, status, sourceVersion, message]
      properties:
        languageId: { type: integer }
        languageTitle: { type: string }
        country: { type: string, enum: [algeria, outside_algeria] }
        courseType: { type: string, enum: [level, conversation, exam] }
        studyMode:
          anyOf:
            - { type: string, enum: [group, individual] }
            - { type: "null" }
        studySystem:
          anyOf:
            - { type: string, enum: [regular, intensive] }
            - { type: "null" }
        weeklySessions:
          anyOf:
            - { type: integer }
            - { type: "null" }
        totalSessions:
          anyOf:
            - { type: integer }
            - { type: "null" }
        duration:
          anyOf:
            - { type: string }
            - { type: "null" }
        amount:
          anyOf:
            - { type: number }
            - { type: "null" }
        currency: { type: string }
        unit: { type: string, enum: [monthly, level, package, unknown] }
        status: { type: string, enum: [approved, needs_review, admin_approved] }
        sourceVersion: { type: string }
        message: { type: string }
    RegistrationRequestInput:
      type: object
      required: [idempotencyKey, fullName, phone, email, country, languageId, courseType, paymentMethod]
      properties:
        idempotencyKey: { type: string, minLength: 36, maxLength: 36 }
        fullName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, minLength: 7, maxLength: 32 }
        email: { type: string, format: email, maxLength: 254 }
        country: { type: string, enum: [algeria, outside_algeria] }
        goals: { type: string, maxLength: 3000 }
        languageId: { type: integer, minimum: 1 }
        courseType: { type: string, enum: [level, conversation, exam] }
        levelAssessment: { type: string, enum: [beginner, placement_test, known] }
        currentLevel: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        targetLevel: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        studyMode: { type: string, enum: [group, individual] }
        studySystem: { type: string, enum: [regular, intensive] }
        weeklySessions: { type: integer, minimum: 1, maximum: 7 }
        totalSessions: { type: integer, minimum: 1, maximum: 100 }
        examName: { type: string, maxLength: 100 }
        targetScore: { type: string, maxLength: 80 }
        examDate: { type: string, format: date }
        schedulePreferences: { type: string, maxLength: 500 }
        paymentMethod: { type: string, enum: [ccp, baridi_mob, edahabia_cib, international_manual, other] }
        paymentMethodOther: { type: string, maxLength: 120 }
    RegistrationReceipt:
      type: object
      required: [requestNo, status, paymentStatus, quote, createdAt]
      properties:
        requestNo: { type: string }
        status: { type: string, enum: [pending_review, accepted, rejected, needs_info] }
        paymentStatus: { type: string, enum: [awaiting_verification, verified, rejected] }
        quote: { $ref: "#/components/schemas/RegistrationQuote" }
        createdAt: { type: string, format: date-time }
    RegistrationAdminRequest:
      type: object
      required: [id, requestNo, fullName, phone, email, country, languageId, languageTitle, courseType, paymentMethod, paymentStatus, status, quote, createdAt, updatedAt]
      properties:
        id: { type: integer }
        requestNo: { type: string }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string }
        country: { type: string, enum: [algeria, outside_algeria] }
        goals: { type: string }
        languageId: { type: integer }
        languageTitle: { type: string }
        courseType: { type: string, enum: [level, conversation, exam] }
        levelAssessment:
          anyOf:
            - { type: string, enum: [beginner, placement_test, known] }
            - { type: "null" }
        currentLevel:
          anyOf:
            - { type: string }
            - { type: "null" }
        targetLevel:
